[package]
name = "am-ci-guard"
# Versioned independently of am-fs-core, and that is the point (#156).
# Ten of the twelve drivers cannot move off am-fs-core 0.2.10 until #147
# has a replacement; they can take this today because it is a different
# package with a different version line.
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared CI guards for the antimatter-studios rust-fs/rust-img family: one required check that stands for every job."
repository = "https://github.com/antimatter-studios/rust-fs-core"
keywords = ["ci", "github-actions", "testing"]
categories = ["development-tools::testing"]

[dependencies]
# The workflow is read as YAML rather than scanned as lines. A quoted
# key, a flow mapping, and a `run: |` block whose CONTENTS look like a
# job key are all ordinary YAML that a line scan reads wrongly -- and a
# guard that misreads its input reports protection it is not providing.
# YAML 1.2, so GitHub's `on:` key stays the string `on` rather than
# folding into a boolean, which is the key this crate has to read to
# tell a gating workflow from a release one. Same version as am-fs-core
# already uses for the same job.
saphyr = "0.0.12"
