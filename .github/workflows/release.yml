name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # The same acknowledgement as ci.yml's `test` and `coverage` jobs:
    # tests/device_node_size.rs needs a loop device, this runner is not
    # root, and without the variable the test fails rather than skips.
    # Declared on the job so every suite run below has it.
    env:
      AM_FS_CORE_ALLOW_UNPRIVILEGED_SKIP: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          if [ "$tag" != "$crate_ver" ]; then
            echo "tag $tag does not match Cargo.toml version $crate_ver" >&2
            exit 1
          fi

      - run: cargo test --locked --all-targets
      # A RELEASE-PROFILE RUN, DECIDED IN #111. The profile published is
      # the release one, and optimisation can change behaviour the debug
      # run never sees: `debug_assert!` bodies vanish, overflow wraps.
      # It runs here, on a tag, not in ci.yml, so pull requests don't pay
      # for a second full suite.
      #
      # Do NOT set EXPECT_OVERFLOW_CHECKS on this run. Overflow checks are
      # meant to be off under --release, so the handshake would arm an
      # assertion that fails every green run. tests/ci_profile.rs refuses
      # that combination.
      - run: cargo test --locked --release --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings

  publish:
    name: publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - uses: rust-lang/crates-io-auth-action@v1.0.4
        id: auth

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
