    name: attest and attach the tools
    needs: [package-darwin-arm64, package-linux-x86_64, package-windows-x86_64, package-windows-arm64, attach-gate]
    # The Windows jobs are skipped for a caller that leaves `windows` off; a
    # skipped job must not stop the attach, a failed or cancelled one must.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ needs.attach-gate.outputs.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
