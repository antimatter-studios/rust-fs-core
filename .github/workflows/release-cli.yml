name: release-cli

# THE FAMILY'S RELEASE TARBALL, PACKAGED, ATTESTED AND ATTACHED FROM ONE
# PLACE. Every repository that ships command-line tools once carried its own
# `package-cli` matrix and its own attest-and-attach job in `release.yml`,
# and the copies drifted: one repository's release never got the jobs and
# shipped no tarball at all (#193). This is the one copy. A repository calls
# it from its tag-triggered `release.yml`:
#
#   cli:
#     needs: [gate, publish]
#     permissions:
#       contents: write
#       id-token: write
#       attestations: write
#     uses: antimatter-studios/rust-fs-core/.github/workflows/release-cli.yml@<sha> # vX.Y.Z
#     with:
#       core-ref: vX.Y.Z
#       toolchain: 1.95.0
#       windows: true    # optional, off by default: see the package jobs
#
# Everything about WHAT is shipped is the caller's, in its Cargo.toml
# (`[package.metadata.package-cli]`, read by scripts/package-cli.sh); this
# file decides only HOW: which platforms, in what order, and with which
# grants. The binary is `<repo>`, the last segment of the caller's
# repository name, which package-cli.sh requires to be a [[bin]] target.
#
# In a called workflow the `github` context is the CALLER's: the checkout is
# the caller's tag and GITHUB_REF_NAME is its tag. THE ATTESTATION'S SIGNER
# IS THIS FILE, NOT THE CALLER'S release.yml. Sigstore takes the
# certificate's Build Signer URI from `job_workflow_ref`, which in a called
# workflow names the called workflow; the caller's release.yml is recorded
# only as the build configuration. Anyone can check a download with
#
#   gh attestation verify <tarball> --repo <owner>/<repo>
#
# and pin the signer with
#
#   gh attestation verify <tarball> --repo <owner>/<repo> \
#     --signer-workflow antimatter-studios/rust-fs-core/.github/workflows/release-cli.yml
#
# Naming the caller's release.yml as --signer-workflow refuses every
# tarball this workflow attests.
#
# tests/release_cli_workflow.rs reads this file and fails on each property
# above; nothing else here would notice, because it runs only on another
# repository's tag.
on:
  workflow_call:
    inputs:
      core-ref:
        description: The rust-fs-core tag the caller's Cargo.toml pins, cloned as its path sibling.
        required: true
        type: string
      toolchain:
        description: The Rust toolchain the caller pins.
        required: true
        type: string
      windows:
        description: Package Windows too, on windows-x86_64 and windows-arm64 legs, as a .zip each.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # One job per platform, each with its own gate, so each platform picks its
  # own runner. The two Windows jobs, and their gates, run only for a caller
  # that sets `windows`.
  package-darwin-arm64-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick macos-arm64

  package-darwin-arm64:
    name: package the tools (darwin-arm64)
    needs: [package-darwin-arm64-gate]
    permissions:
      contents: read
    runs-on: ${{ needs.package-darwin-arm64-gate.outputs.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: C toolchain for the gated runner
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # A tarball named for a branch would be a release nobody tagged.
      - name: refuse anything but a version tag
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::release-cli packages a version tag, not $GITHUB_REF" >&2; exit 1 ;;
          esac

      # The path dependency, at the tag the caller pins. Through env: a
      # caller's input is text, and spliced into a script it would be code.
      - name: clone the rust-fs-core sibling
        shell: bash
        env:
          CORE_REF: ${{ inputs.core-ref }}
        run: git clone --depth 1 --branch "$CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      # THE NOTES BEFORE ANYTHING IS BUILT. A release's body is its CHANGELOG
      # section, written by github-guard's changelog extraction through
      # agent-skills' changelog-notes action: the same code the git-changelog
      # pre-push guard checks the tag with, so the two cannot disagree. A tag
      # the CHANGELOG does not describe stops here, before a tarball exists.
      # One leg writes the file the attach job uses: that job checks nothing
      # out, so the notes travel as an artifact. Not on a Windows leg: the
      # guard is a bash script run by its #! line, and the unix legs have
      # already refused the tag, so `attach`, which needs every leg, never
      # runs for it.
      - name: the CHANGELOG describes this version
        if: runner.os != 'Windows'
        uses: antimatter-studios/agent-skills/.github/actions/changelog-notes@ed0b96812c5908478dcd84543debf4d5f8bf87e3
        with:
          tag: ${{ github.ref_name }}
          output-file: notes/release-notes.md

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: ${{ inputs.toolchain }}

      # Statically on Windows: GitHub's runners have the Visual C++ runtime, and
      # a clean Windows install does not, so a binary that imports it passes
      # here and does not start there (#411).
      - name: build the multi-call binary
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --features cli --bin "${GITHUB_REPOSITORY##*/}"

      # package-cli.sh prints the asset's name on stdout and checks the
      # asset it built: exactly the contracted members, every dotted name
      # a relative symlink (a copy of bin/<repo>.exe in a Windows leg's
      # .zip), and every name answering --help and --version.
      - name: package and check the tarball
        id: pack
        shell: bash
        env:
          LABEL: darwin-arm64
        run: |
          set -euo pipefail
          bash ../rust-fs-core/scripts/package-cli.sh "${GITHUB_REF_NAME#v}" "$LABEL" > "$RUNNER_TEMP/tarball"
          tarball="$(tail -n 1 "$RUNNER_TEMP/tarball")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          # A formula needs this to verify the download; in the job summary,
          # updating one is a copy, not a re-download.
          {
            echo "### $tarball"
            echo ""
            echo '```'
            # sha256sum where there is one (Linux, Git Bash on Windows),
            # shasum on macOS, which has no sha256sum.
            if command -v sha256sum >/dev/null 2>&1; then
              echo "sha256 $(sha256sum "$tarball" | cut -d' ' -f1)"
            else
              echo "sha256 $(shasum -a 256 "$tarball" | cut -d' ' -f1)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # AN ARTIFACT, NOT THE RELEASE: a leg that published its own asset
      # would do so whether or not the other leg later failed.
      - name: keep the tarball for the attach job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-darwin-arm64
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

