    if: ${{ !cancelled() && !failure() }}
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  # The only job with a write grant, and it checks nothing out and builds
  # nothing: it downloads the legs' tarballs, attests their provenance, and
  # hands them to `gh`.
